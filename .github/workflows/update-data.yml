name: Update NFL Stats Data

on:
  # Run every Tuesday at 6 AM EST (11 AM UTC) to capture all week's games (Thu-Mon)
  schedule:
    - cron: '0 11 * * 2'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (for testing)
  push:
    branches: [ main ]
    paths:
      - 'scripts/fetch-data.js'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

# Never run two data updates at once (they would race on the push)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Fetch NFL data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Validate fetched data (fails the run so bad data is never committed)
        run: node scripts/validate-data.js
        
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push if changed
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore: Update NFL stats data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          # main may have moved while we fetched (e.g. several PRs merged at once).
          # Rebase our data-only commit onto the latest main and retry.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main..."
            git pull --rebase origin main
            sleep 5
          done
          echo "Push failed after 3 attempts"; exit 1
          
      - name: No changes
        if: steps.verify-changed-files.outputs.changed == 'false'
        run: echo "No data changes detected"
